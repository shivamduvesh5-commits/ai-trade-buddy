
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080d18">
<link rel="manifest" href="./manifest.json">
<title>AI Trade Buddy</title>
<style>
body{background:#080d18;color:white;font-family:Arial;padding:18px}
h1{color:#42a5ff}
.card{background:#172337;padding:18px;border-radius:14px;margin:15px 0}
select,button{width:100%;padding:14px;margin:8px 0;border-radius:9px;border:0}
button{background:#087eeb;color:white;font-weight:bold}
select{background:#293950;color:white}
small{color:#aab8cc}
</style>
</head>
<body>
<h1>🤖 AI Trade Buddy</h1>
<p>Your Personal Crypto Trading Assistant</p>

<div class="card">
<h3>📊 Select Market</h3>
<select id="market">
<option>BTCUSD</option>
<option>ETHUSD</option>
<option>SOLUSD</option>
<option>BNBUSD</option>
<option>XRPUSD</option>
<option>DOGEUSD</option>
<option>ADAUSD</option>
<option>LINKUSD</option>
<option>AVAXUSD</option>
</select>

<h3>⏱ Timeframe</h3>
<select id="time">
<option>5 Minutes</option>
<option>15 Minutes</option>
<option>1 Hour</option>
<option>4 Hours</option>
<option>1 Day</option>
</select>

<button onclick="analyze()">Analyze Market</button>
</div>

<div class="card">
<h3>🧠 Market Analysis</h3>
<div id="result">Waiting for analysis...</div>
<small>Demo only. Live market data is not connected.</small>
</div>

<div class="card">
<h3>🛡 Risk Management</h3>
<p>Always use Stop Loss.</p>
<p>Suggested risk limit: 1% per trade.</p>
</div>

<div class="card">
<button id="install" hidden>Install App</button>
</div>

<script>
function analyze(){
let m=document.getElementById("market").value;
let t=document.getElementById("time").value;
document.getElementById("result").innerHTML=
"Market: "+m+"<br>Timeframe: "+t+
"<br><br>Live AI analysis is not connected yet.";
}
let installPrompt;
window.addEventListener("beforeinstallprompt",e=>{
e.preventDefault();
installPrompt=e;
document.getElementById("install").hidden=false;
});
document.getElementById("install").onclick=async()=>{
if(!installPrompt)return;
installPrompt.prompt();
installPrompt=null;
};
if("serviceWorker" in navigator){
window.addEventListener("load",()=>{
navigator.serviceWorker.register("./service-worker.js");
});
}
</script>
</body>
</html>
