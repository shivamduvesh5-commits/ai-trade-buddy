
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080d18">
<link rel="manifest" href="./manifest.json">
<title>AI Trade Buddy</title>
<style>
body{background:#080d18;color:white;font-family:Arial;padding:18px}
h1{color:#42a5ff}
.card{background:#172337;padding:18px;border-radius:14px;margin:15px 0}
select,button{width:100%;padding:14px;margin:8px 0;border-radius:9px;border:0}
button{background:#087eeb;color:white;font-weight:bold}
select{background:#293950;color:white}
.price{font-size:28px;color:#35db91;font-weight:bold}
small{color:#aab8cc}
</style>
</head>
<body>
<h1>🤖 AI Trade Buddy</h1>
<p>Delta Exchange India Live Market</p>

<div class="card">
<h3>📊 Select Market</h3>
<select id="market">
<option>BTCUSD</option>
<option>ETHUSD</option>
<option>SOLUSD</option>
<option>XRPUSD</option>
<option>DOGEUSD</option>
<option>BNBUSD</option>
</select>

<h3>Live Price</h3>
<div id="price" class="price">Loading...</div>
<p id="mark">Mark Price: --</p>
<p id="volume">24h Volume: --</p>
<p id="status">Connecting...</p>
<button onclick="loadMarket()">Refresh Price</button>
</div>

<div class="card">
<h3>🧠 AI Analysis</h3>
<p id="analysis">Live AI analysis not connected yet.</p>
<small>Market data only. No trading signals generated.</small>
</div>

<script>
const API="https://api.india.delta.exchange";

async function loadMarket(){
 const symbol=document.getElementById("market").value;
 const status=document.getElementById("status");
 status.textContent="Fetching live data...";
 try{
  const response=await fetch(API+"/v2/tickers");
  if(!response.ok) throw new Error("API error "+response.status);
  const data=await response.json();
  const tickers=data.result||[];
  const ticker=tickers.find(x=>x.symbol===symbol);
  if(!ticker) throw new Error("Market not found: "+symbol);

  document.getElementById("price").textContent=
   "₹ "+(ticker.close||ticker.last_price||"Unavailable");
  document.getElementById("mark").textContent=
   "Mark Price: "+(ticker.mark_price||"--");
  document.getElementById("volume").textContent=
   "24h Volume: "+(ticker.volume||"--");
  status.textContent="Live data updated: "+new Date().toLocaleTimeString();
 }catch(error){
  status.textContent="Data unavailable: "+error.message;
  document.getElementById("price").textContent="Unavailable";
 }
}

document.getElementById("market").addEventListener("change",loadMarket);
loadMarket();
setInterval(loadMarket,15000);

if("serviceWorker" in navigator){
 navigator.serviceWorker.register("./service-worker.js");
}
</script>
</body>
</html>
